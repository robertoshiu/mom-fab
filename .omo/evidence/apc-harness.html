<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>APC harness</title>
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/theme.css">
<link rel="stylesheet" href="../../styles/components.css">
<script type="importmap">
{ "imports": { "d3": "https://esm.sh/d3@7" } }
</script>
<style>
  html,body{height:100%;margin:0;background:var(--bg-primary);}
  #content{height:100vh;width:100vw;}
  .route-view{height:100%;}
</style>
</head>
<body>
<section id="content"><div class="route-view"></div></section>
<script type="module">
import apc from '../../modules/apc.js';
import { Dispatcher } from '../../engine/dispatcher.js';
import { SimulationState } from '../../engine/state.js';
import { t } from '../../i18n/index.js';

const view = document.querySelector('.route-view');
const dispatcher = new Dispatcher();
const state = new SimulationState();
const ctx = { state, dispatcher, t, router: { set(){}, getActive(){return 'apc';}, refreshActive(){} } };

apc.init(view, ctx);
// drive to a populated tick so windows are full (deterministic)
const TICK = 60;
apc.update(view, ctx, TICK);

window.__H = {
  apc, ctx, view, TICK,
  setController(which){
    const b = [...view.querySelectorAll('.apc-seg-btn')].find(x=>x.dataset.controller===which);
    if (b) b.click();
    apc.update(view, ctx, TICK);
    return view.querySelector('.apc-seg-btn.is-active')?.dataset.controller;
  },
  // serialize the R2R series y-values for hash comparison (independent of pixels)
  r2rValues(){
    return [...view.querySelectorAll('.apc-r2r circle.ck-pt')].map(c=>+(+c.getAttribute('cy')).toFixed(2));
  },
  ready: true
};
</script>
</body>
</html>
