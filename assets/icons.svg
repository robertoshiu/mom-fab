<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs/>
  <!-- All symbols: 20px viewBox, stroke currentColor 1.5, fill none, round caps/joins.
       Consume via <svg class="icon"><use href="assets/icons.svg#i-NAME"/></svg> -->

  <!-- ===== 9 module concepts ===== -->
  <symbol id="i-mes" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 16V8l5-5 5 5 6-6"/><path d="M18 2v6h-6"/>
  </symbol>
  <symbol id="i-aps" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 5h14M3 10h9M3 15h12"/>
  </symbol>
  <symbol id="i-erp" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="2.5" width="6" height="6"/><rect x="11.5" y="11.5" width="6" height="6"/><path d="M8.5 4.5h6v6M11.5 15.5h-6v-6"/>
  </symbol>
  <symbol id="i-spc" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 15l4-4 4 3 5-8 3 4"/>
  </symbol>
  <symbol id="i-apc" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="7.5"/><path d="M10 5v5l4 2.5"/>
  </symbol>
  <symbol id="i-wip" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 14.5V7l7.5-4 7.5 4v7.5L10 18.5z"/><path d="M2.5 7L10 11l7.5-4M10 11v7.5"/>
  </symbol>
  <symbol id="i-scm" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1.5 13h4l2.5-8 3.5 11 2.5-6h4.5"/>
  </symbol>
  <symbol id="i-recipe" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="2.5" width="10" height="4"/><rect x="2.5" y="9.5" width="15" height="8"/><path d="M5.5 12.5h9M5.5 15h6"/>
  </symbol>
  <symbol id="i-yield" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="7.5"/><circle cx="10" cy="10" r="3"/>
  </symbol>

  <!-- ===== transport / playback ===== -->
  <symbol id="i-play" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 3.5l11 6.5-11 6.5z"/>
  </symbol>
  <symbol id="i-pause" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 3.5v13M13.5 3.5v13"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 4v4h-4"/><path d="M16.5 8A7 7 0 1 0 17.5 12.5"/>
  </symbol>

  <!-- ===== status ===== -->
  <symbol id="i-alert-triangle" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 2.5L18.5 17H1.5z"/><path d="M10 8v4"/><path d="M10 14.5v.01"/>
  </symbol>
  <symbol id="i-alert-square" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="2.5" width="15" height="15"/><path d="M10 6v5"/><path d="M10 14v.01"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 10.5l4 4 9-9"/>
  </symbol>
  <symbol id="i-x" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 5l10 10M15 5L5 15"/>
  </symbol>
  <symbol id="i-info" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="7.5"/><path d="M10 9v4.5"/><path d="M10 6.5v.01"/>
  </symbol>
  <symbol id="i-clock" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="7.5"/><path d="M10 5.5V10l3 2"/>
  </symbol>

  <!-- ===== controls ===== -->
  <symbol id="i-settings" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="2.5"/><path d="M10 1.5v2.2M10 16.3v2.2M3 3l1.6 1.6M15.4 15.4L17 17M1.5 10h2.2M16.3 10h2.2M3 17l1.6-1.6M15.4 4.6L17 3"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.5 12.5l4.5 4.5"/>
  </symbol>
  <symbol id="i-filter" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h15l-6 7v5l-3 1.5v-6.5z"/>
  </symbol>
  <symbol id="i-sort" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4v12M5 16l-2.5-2.5M5 16l2.5-2.5M15 16V4M15 4l-2.5 2.5M15 4l2.5 2.5"/>
  </symbol>
  <symbol id="i-download" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 2.5v10M10 12.5l-3.5-3.5M10 12.5l3.5-3.5M3 16.5h14"/>
  </symbol>

  <!-- ===== chevrons ===== -->
  <symbol id="i-chevron-down" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7l6 6 6-6"/>
  </symbol>
  <symbol id="i-chevron-up" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 13l6-6 6 6"/>
  </symbol>
  <symbol id="i-chevron-left" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 4l-6 6 6 6"/>
  </symbol>
  <symbol id="i-chevron-right" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 4l6 6-6 6"/>
  </symbol>

  <!-- ===== view modes ===== -->
  <symbol id="i-layers" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 2l8 4-8 4-8-4z"/><path d="M2 10l8 4 8-4M2 14l8 4 8-4"/>
  </symbol>
  <symbol id="i-grid" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="2.5" width="6" height="6"/><rect x="11.5" y="2.5" width="6" height="6"/><rect x="2.5" y="11.5" width="6" height="6"/><rect x="11.5" y="11.5" width="6" height="6"/>
  </symbol>
  <symbol id="i-list" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 5h11M6.5 10h11M6.5 15h11M2.5 5h.01M2.5 10h.01M2.5 15h.01"/>
  </symbol>

  <!-- ===== theme / locale ===== -->
  <symbol id="i-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="3.5"/><path d="M10 1.5v2M10 16.5v2M3 3l1.4 1.4M15.6 15.6L17 17M1.5 10h2M16.5 10h2M3 17l1.4-1.4M15.6 4.4L17 3"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16.5 11.5A7 7 0 0 1 8.5 3.5a7 7 0 1 0 8 8z"/>
  </symbol>
  <symbol id="i-globe" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="7.5"/><path d="M2.5 10h15M10 2.5c2 2.2 3 4.8 3 7.5s-1 5.3-3 7.5c-2-2.2-3-4.8-3-7.5s1-5.3 3-7.5z"/>
  </symbol>
</svg>
